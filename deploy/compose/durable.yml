services:
  graphnest-indexer:
    profiles: [durable]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    image: ${GRAPHNEST_NODE_IMAGE:?GRAPHNEST_NODE_IMAGE is required}
    entrypoint: ["graphnest-indexer"]
    depends_on:
      postgres:
        condition: service_healthy
      zoekt-durable:
        condition: service_healthy
    environment:
      GRAPHNEST_DATABASE_URL: postgres://graphnest:graphnest@postgres:5432/graphnest?sslmode=disable
      GRAPHNEST_ZOEKT_URL: http://zoekt-durable:6070
      GRAPHNEST_SEARCH_BACKEND: ${GRAPHNEST_SEARCH_BACKEND:-zoekt}
      GRAPHNEST_GITHUB_WEB_URL: ${GRAPHNEST_GITHUB_WEB_URL:?GRAPHNEST_GITHUB_WEB_URL is required}
      GRAPHNEST_GITHUB_API_URL: ${GRAPHNEST_GITHUB_API_URL:?GRAPHNEST_GITHUB_API_URL is required}
      GRAPHNEST_GITHUB_UPLOAD_URL: ${GRAPHNEST_GITHUB_UPLOAD_URL:?GRAPHNEST_GITHUB_UPLOAD_URL is required}
      GRAPHNEST_GITHUB_GIT_URL: ${GRAPHNEST_GITHUB_GIT_URL:?GRAPHNEST_GITHUB_GIT_URL is required}
      GRAPHNEST_GITHUB_APP_ID: ${GRAPHNEST_GITHUB_APP_ID:?GRAPHNEST_GITHUB_APP_ID is required}
      GRAPHNEST_GITHUB_CA_FILE: ${GRAPHNEST_GITHUB_CA_FILE:+/run/secrets/graphnest/github-ca.pem}
      GRAPHNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/graphnest/private-key.pem
      GRAPHNEST_DATA_DIR: /var/lib/graphnest/work
      GRAPHNEST_INDEX_DIR: /var/lib/graphnest/index
      GRAPHNEST_SOURCE_PROVIDER: archive
      GRAPHNEST_ZOEKT_INDEX: /usr/local/bin/zoekt-index
      GRAPHNEST_WORKER_ID: primary
      GRAPHNEST_MIN_FREE_BYTES: 1073741824
    volumes:
      - type: tmpfs
        target: /var/lib/graphnest/work
        tmpfs:
          size: 6442450944
      - ../../.cache/durable-index:/var/lib/graphnest/index
      - type: bind
        source: ${GRAPHNEST_GITHUB_PRIVATE_KEY_FILE:?GRAPHNEST_GITHUB_PRIVATE_KEY_FILE is required}
        target: /run/secrets/graphnest/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_GITHUB_CA_FILE:-/dev/null}
        target: /run/secrets/graphnest/github-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]

  graphnest-server:
    profiles: [durable]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    image: ${GRAPHNEST_APPLICATION_IMAGE:?GRAPHNEST_APPLICATION_IMAGE is required}
    entrypoint: ["graphnest-server"]
    depends_on:
      postgres:
        condition: service_healthy
      zoekt-durable:
        condition: service_healthy
    environment:
      GRAPHNEST_DATABASE_URL: postgres://graphnest:graphnest@postgres:5432/graphnest?sslmode=disable
      GRAPHNEST_ZOEKT_URL: http://zoekt-durable:6070
      GRAPHNEST_GITHUB_WEB_URL: ${GRAPHNEST_GITHUB_WEB_URL:?GRAPHNEST_GITHUB_WEB_URL is required}
      GRAPHNEST_GITHUB_API_URL: ${GRAPHNEST_GITHUB_API_URL:?GRAPHNEST_GITHUB_API_URL is required}
      GRAPHNEST_GITHUB_UPLOAD_URL: ${GRAPHNEST_GITHUB_UPLOAD_URL:?GRAPHNEST_GITHUB_UPLOAD_URL is required}
      GRAPHNEST_GITHUB_GIT_URL: ${GRAPHNEST_GITHUB_GIT_URL:?GRAPHNEST_GITHUB_GIT_URL is required}
      GRAPHNEST_GITHUB_APP_ID: ${GRAPHNEST_GITHUB_APP_ID:?GRAPHNEST_GITHUB_APP_ID is required}
      GRAPHNEST_GITHUB_CA_FILE: ${GRAPHNEST_GITHUB_CA_FILE:+/run/secrets/graphnest/github-ca.pem}
      GRAPHNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/graphnest/private-key.pem
      GRAPHNEST_GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/graphnest/webhook-secret
      GRAPHNEST_SCIP_MAX_UPLOAD_BYTES: ${GRAPHNEST_SCIP_MAX_UPLOAD_BYTES:-67108864}
      GRAPHNEST_PUBLIC_URL: ${GRAPHNEST_PUBLIC_URL:-}
      GRAPHNEST_SSO_SESSION_IDLE: ${GRAPHNEST_SSO_SESSION_IDLE:-}
      GRAPHNEST_SSO_SESSION_TTL: ${GRAPHNEST_SSO_SESSION_TTL:-}
      GRAPHNEST_SSO_LOGIN_FLOW_TTL: ${GRAPHNEST_SSO_LOGIN_FLOW_TTL:-}
      GRAPHNEST_OIDC_ISSUER_URL: ${GRAPHNEST_OIDC_ISSUER_URL:-}
      GRAPHNEST_OIDC_CLIENT_ID: ${GRAPHNEST_OIDC_CLIENT_ID:-}
      GRAPHNEST_OIDC_CLIENT_SECRET_FILE: ${GRAPHNEST_OIDC_CLIENT_SECRET_FILE:+/run/secrets/graphnest/oidc-client-secret}
      GRAPHNEST_OIDC_CA_FILE: ${GRAPHNEST_OIDC_CA_FILE:+/run/secrets/graphnest/oidc-ca.pem}
      GRAPHNEST_OIDC_SCOPES: ${GRAPHNEST_OIDC_SCOPES:-}
      GRAPHNEST_OIDC_LINK_CLAIM: ${GRAPHNEST_OIDC_LINK_CLAIM:-}
      GRAPHNEST_OIDC_DISPLAY_NAME_CLAIM: ${GRAPHNEST_OIDC_DISPLAY_NAME_CLAIM:-}
      GRAPHNEST_OAUTH_GITHUB_CLIENT_ID: ${GRAPHNEST_OAUTH_GITHUB_CLIENT_ID:-}
      GRAPHNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE: ${GRAPHNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE:+/run/secrets/graphnest/oauth-github-client-secret}
      GRAPHNEST_SCIM_TOKEN_FILE: ${GRAPHNEST_SCIM_TOKEN_FILE:+/run/secrets/graphnest/scim/token}
      GRAPHNEST_BREAK_GLASS_ENABLED: ${GRAPHNEST_BREAK_GLASS_ENABLED:-false}
    volumes:
      - type: bind
        source: ${GRAPHNEST_GITHUB_PRIVATE_KEY_FILE:?GRAPHNEST_GITHUB_PRIVATE_KEY_FILE is required}
        target: /run/secrets/graphnest/private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_GITHUB_WEBHOOK_SECRET_FILE:?GRAPHNEST_GITHUB_WEBHOOK_SECRET_FILE is required}
        target: /run/secrets/graphnest/webhook-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_GITHUB_CA_FILE:-/dev/null}
        target: /run/secrets/graphnest/github-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_OIDC_CLIENT_SECRET_FILE:-/dev/null}
        target: /run/secrets/graphnest/oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_OIDC_CA_FILE:-/dev/null}
        target: /run/secrets/graphnest/oidc-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_OAUTH_GITHUB_CLIENT_SECRET_FILE:-/dev/null}
        target: /run/secrets/graphnest/oauth-github-client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GRAPHNEST_SCIM_TOKEN_FILE:-/dev/null}
        target: /run/secrets/graphnest/scim/token
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [internal, loopback]
