services:
  grepnest-server:
    depends_on:
      grepnest-indexer:
        condition: service_started
    environment:
      GREPNEST_GRAPH_URL: http://grepnest-graph:8081
      GREPNEST_GRAPH_SECRET_FILE: /run/secrets/grepnest/graph-secret
    volumes:
      - grepnest-data:/var/lib/grepnest/graph
      - type: bind
        source: ${GREPNEST_GRAPH_INTERNAL_SECRET_FILE:?GREPNEST_GRAPH_INTERNAL_SECRET_FILE is required}
        target: /run/secrets/grepnest/graph-secret
        read_only: true
        bind:
          create_host_path: false

  grepnest-indexer:
    environment:
      GREPNEST_GRAPH_MODE: embedded
      GREPNEST_GRAPH_DATA_DIR: /var/lib/grepnest/graph
      GREPNEST_GRAPH_LISTEN_ADDRESS: :8081
      GREPNEST_GRAPH_SECRET_FILE: /run/secrets/grepnest/graph-secret
    volumes:
      - type: bind
        source: ${GREPNEST_GRAPH_INTERNAL_SECRET_FILE:?GREPNEST_GRAPH_INTERNAL_SECRET_FILE is required}
        target: /run/secrets/grepnest/graph-secret
        read_only: true
        bind:
          create_host_path: false
    networks:
      internal:
        aliases: [grepnest-graph]
