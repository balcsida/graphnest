services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: graphnest
      POSTGRES_PASSWORD: graphnest
      POSTGRES_USER: graphnest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphnest"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]

  zoekt-index:
    profiles: [fixture]
    image: ghcr.io/sourcegraph/zoekt@sha256:8fd1bec6553e5039f0a52ae6c3c3980bf734e5b105b5171e2aed104595b067aa
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp -R /fixture /tmp/repository
        git init --initial-branch=main /tmp/repository
        git -C /tmp/repository config user.name "GraphNest Test"
        git -C /tmp/repository config user.email test@graphnest.invalid
        git -C /tmp/repository config zoekt.repoid 7
        git -C /tmp/repository config zoekt.name fixture/repository
        git -C /tmp/repository add .
        GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z git -C /tmp/repository commit -m fixture
        zoekt-git-index -index /data/index -branches main -submodules=false -incremental=false /tmp/repository
    volumes:
      - ../../test/fixtures/repository:/fixture:ro
      - zoekt-index:/data/index
    networks: [internal]

  zoekt:
    profiles: [fixture]
    image: ghcr.io/sourcegraph/zoekt@sha256:8fd1bec6553e5039f0a52ae6c3c3980bf734e5b105b5171e2aed104595b067aa
    platform: linux/amd64
    entrypoint: ["zoekt-webserver"]
    command: ["-index", "/data/index", "-listen", ":6070", "-rpc", "-html=false"]
    ports:
      - "127.0.0.1:6070:6070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header 'Content-Type: application/json' --post-data '{\"Q\":\"file:.\",\"RepoIDs\":[],\"Opts\":{\"MaxDocDisplayCount\":1}}' http://127.0.0.1:6070/api/search >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - zoekt-index:/data/index:ro
    networks: [internal, loopback]

  zoekt-durable:
    profiles: [durable]
    image: ghcr.io/sourcegraph/zoekt@sha256:8fd1bec6553e5039f0a52ae6c3c3980bf734e5b105b5171e2aed104595b067aa
    platform: linux/amd64
    entrypoint: ["zoekt-webserver"]
    command: ["-index", "/data/index", "-listen", ":6070", "-rpc", "-html=false"]
    ports:
      - "127.0.0.1:6070:6070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header 'Content-Type: application/json' --post-data '{\"Q\":\"file:.\",\"RepoIDs\":[],\"Opts\":{\"MaxDocDisplayCount\":1}}' http://127.0.0.1:6070/api/search >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - ../../.cache/durable-index:/data/index:ro
    networks: [internal, loopback]

networks:
  internal:
    internal: true
  loopback:

volumes:
  zoekt-index:
