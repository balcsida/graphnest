services:
  grepnest-server:
    profiles: [durable]
    image: ${GREPNEST_APPLICATION_IMAGE:-grepnest/application:local}
    depends_on:
      postgres:
        condition: service_healthy
      zoekt-durable:
        condition: service_healthy
    environment:
      GREPNEST_DATABASE_URL: postgres://grepnest:grepnest@postgres:5432/grepnest?sslmode=disable
      GREPNEST_ZOEKT_URL: http://zoekt-durable:6070
      GREPNEST_GITHUB_WEB_URL: ${GREPNEST_GITHUB_WEB_URL:?GREPNEST_GITHUB_WEB_URL is required}
      GREPNEST_GITHUB_API_URL: ${GREPNEST_GITHUB_API_URL:?GREPNEST_GITHUB_API_URL is required}
      GREPNEST_GITHUB_UPLOAD_URL: ${GREPNEST_GITHUB_UPLOAD_URL:?GREPNEST_GITHUB_UPLOAD_URL is required}
      GREPNEST_GITHUB_GIT_URL: ${GREPNEST_GITHUB_GIT_URL:?GREPNEST_GITHUB_GIT_URL is required}
      GREPNEST_GITHUB_APP_ID: ${GREPNEST_GITHUB_APP_ID:?GREPNEST_GITHUB_APP_ID is required}
      GREPNEST_GITHUB_PRIVATE_KEY_FILE: /run/secrets/grepnest/private-key.pem
      GREPNEST_GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/grepnest/webhook-secret
      GREPNEST_USER_TOKEN: ${GREPNEST_USER_TOKEN:?GREPNEST_USER_TOKEN is required}
      GREPNEST_USER_INSTALLATION_ID: ${GREPNEST_USER_INSTALLATION_ID:?GREPNEST_USER_INSTALLATION_ID is required}
      GREPNEST_USER_REPOSITORY_IDS: ${GREPNEST_USER_REPOSITORY_IDS:?GREPNEST_USER_REPOSITORY_IDS is required}
      GREPNEST_ADMIN_TOKEN: ${GREPNEST_ADMIN_TOKEN:?GREPNEST_ADMIN_TOKEN is required}
      GREPNEST_ADMIN_INSTALLATION_ID: ${GREPNEST_ADMIN_INSTALLATION_ID:?GREPNEST_ADMIN_INSTALLATION_ID is required}
      GREPNEST_ADMIN_REPOSITORY_IDS: ${GREPNEST_ADMIN_REPOSITORY_IDS:?GREPNEST_ADMIN_REPOSITORY_IDS is required}
      GREPNEST_SCIP_MAX_UPLOAD_BYTES: ${GREPNEST_SCIP_MAX_UPLOAD_BYTES:-67108864}
    volumes:
      - ${GREPNEST_GITHUB_PRIVATE_KEY_FILE:?GREPNEST_GITHUB_PRIVATE_KEY_FILE is required}:/run/secrets/grepnest/private-key.pem:ro
      - ${GREPNEST_GITHUB_WEBHOOK_SECRET_FILE:?GREPNEST_GITHUB_WEBHOOK_SECRET_FILE is required}:/run/secrets/grepnest/webhook-secret:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, loopback]

  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: grepnest
      POSTGRES_PASSWORD: grepnest
      POSTGRES_USER: grepnest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grepnest"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]

  zoekt-index:
    profiles: [fixture]
    image: ghcr.io/sourcegraph/zoekt@sha256:ac76391662c77d02f5be73b64272304415dbc42cac70633ef89d28747edff4cd
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp -R /fixture /tmp/repository
        git init --initial-branch=main /tmp/repository
        git -C /tmp/repository config user.name "GrepNest Test"
        git -C /tmp/repository config user.email test@grepnest.invalid
        git -C /tmp/repository config zoekt.repoid 7
        git -C /tmp/repository config zoekt.name fixture/repository
        git -C /tmp/repository add .
        git -C /tmp/repository commit -m fixture
        zoekt-git-index -index /data/index -branches main -submodules=false -incremental=false /tmp/repository
    volumes:
      - ../../test/fixtures/repository:/fixture:ro
      - zoekt-index:/data/index
    networks: [internal]

  zoekt:
    profiles: [fixture]
    image: ghcr.io/sourcegraph/zoekt@sha256:ac76391662c77d02f5be73b64272304415dbc42cac70633ef89d28747edff4cd
    platform: linux/amd64
    entrypoint: ["zoekt-webserver"]
    command: ["-index", "/data/index", "-listen", ":6070", "-rpc", "-html=false"]
    ports:
      - "127.0.0.1:6070:6070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header 'Content-Type: application/json' --post-data '{\"Q\":\"file:.\",\"RepoIDs\":[],\"Opts\":{\"MaxDocDisplayCount\":1}}' http://127.0.0.1:6070/api/search >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - zoekt-index:/data/index:ro
    networks: [internal, loopback]

  zoekt-durable:
    profiles: [durable]
    image: ghcr.io/sourcegraph/zoekt@sha256:ac76391662c77d02f5be73b64272304415dbc42cac70633ef89d28747edff4cd
    platform: linux/amd64
    entrypoint: ["zoekt-webserver"]
    command: ["-index", "/data/index", "-listen", ":6070", "-rpc", "-html=false"]
    ports:
      - "127.0.0.1:6070:6070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header 'Content-Type: application/json' --post-data '{\"Q\":\"file:.\",\"RepoIDs\":[],\"Opts\":{\"MaxDocDisplayCount\":1}}' http://127.0.0.1:6070/api/search >/dev/null"]
      interval: 1s
      timeout: 1s
      retries: 30
    volumes:
      - ../../.cache/durable-index:/data/index:ro
    networks: [internal, loopback]

networks:
  internal:
    internal: true
  loopback:

volumes:
  zoekt-index:
