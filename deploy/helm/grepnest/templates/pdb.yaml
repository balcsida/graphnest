{{- if .Values.server.pdb.enabled }}
{{- if le (int .Values.server.replicas) 1 }}
{{- fail "server.replicas must exceed server.pdb.minAvailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "grepnest.serverName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
