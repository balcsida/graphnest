apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "grepnest.fullname" . }}-migrate
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "grepnest.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "grepnest.fullname" . }}-migrate
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.migration.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migration.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migration.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "grepnest.image" .Values.images.application | quote }}
          imagePullPolicy: {{ .Values.images.application.pullPolicy }}
          command: [{{ .Values.migration.executable | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          env:
            - {name: HOME, value: /var/run/grepnest}
            - name: GREPNEST_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.runtime.name }}, key: {{ .Values.secrets.runtime.databaseURLKey }}}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-home, mountPath: /var/run/grepnest}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: runtime-home, emptyDir: {}}
