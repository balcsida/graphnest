apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grepnest.serverName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grepnest.fullname" . }}-migrate
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
automountServiceAccountToken: false
