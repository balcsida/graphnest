apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grepnest.serverName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  GREPNEST_LISTEN_ADDRESS: {{ printf ":%v" .Values.server.port | quote }}
  GREPNEST_ZOEKT_URL: {{ printf "http://%s:%v" (include "grepnest.zoektName" .) .Values.node.service.port | quote }}
  GREPNEST_GITHUB_WEB_URL: {{ .Values.server.config.githubWebURL | quote }}
  GREPNEST_GITHUB_API_URL: {{ .Values.server.config.githubAPIURL | quote }}
  GREPNEST_GITHUB_UPLOAD_URL: {{ .Values.server.config.githubUploadURL | quote }}
  GREPNEST_GITHUB_GIT_URL: {{ .Values.server.config.githubGitURL | quote }}
  GREPNEST_GITHUB_API_VERSION: {{ .Values.server.config.githubAPIVersion | quote }}
  GREPNEST_GITHUB_APP_ID: {{ .Values.server.config.githubAppID | quote }}
  GREPNEST_USER_INSTALLATION_ID: {{ .Values.server.config.userInstallationID | quote }}
  GREPNEST_ADMIN_INSTALLATION_ID: {{ .Values.server.config.adminInstallationID | quote }}
  GREPNEST_USER_REPOSITORY_IDS: {{ .Values.server.config.userRepositoryIDs | quote }}
  GREPNEST_ADMIN_REPOSITORY_IDS: {{ .Values.server.config.adminRepositoryIDs | quote }}
  GREPNEST_DEFAULT_RESULTS: {{ .Values.server.config.defaultResults | quote }}
  GREPNEST_MAX_RESULTS: {{ .Values.server.config.maxResults | quote }}
  GREPNEST_DEFAULT_CONTEXT_LINES: {{ .Values.server.config.defaultContextLines | quote }}
  GREPNEST_MAX_CONTEXT_LINES: {{ .Values.server.config.maxContextLines | quote }}
  GREPNEST_DEFAULT_TIMEOUT: {{ .Values.server.config.defaultTimeout | quote }}
  GREPNEST_MAX_TIMEOUT: {{ .Values.server.config.maxTimeout | quote }}
  GREPNEST_MAX_REQUEST_BYTES: {{ .Values.server.config.maxRequestBytes | quote }}
  GREPNEST_MAX_RESPONSE_BYTES: {{ .Values.server.config.maxResponseBytes | quote }}
  GREPNEST_SCIP_MAX_UPLOAD_BYTES: {{ printf "%d" (int64 .Values.server.config.scipMaxUploadBytes) | quote }}
  GREPNEST_GITHUB_PRIVATE_KEY_FILE: /var/run/secrets/grepnest/github/private-key.pem
  GREPNEST_GITHUB_WEBHOOK_SECRET_FILE: /var/run/secrets/grepnest/github/webhook-secret
  {{- if .Values.secrets.customCA.name }}
  GREPNEST_GITHUB_CA_FILE: /var/run/secrets/grepnest/ca/ca.crt
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grepnest.nodeName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
data:
  GREPNEST_ZOEKT_URL: {{ printf "http://%s:%v" (include "grepnest.zoektName" .) .Values.node.service.port | quote }}
  GREPNEST_GITHUB_WEB_URL: {{ .Values.server.config.githubWebURL | quote }}
  GREPNEST_GITHUB_API_URL: {{ .Values.server.config.githubAPIURL | quote }}
  GREPNEST_GITHUB_UPLOAD_URL: {{ .Values.server.config.githubUploadURL | quote }}
  GREPNEST_GITHUB_GIT_URL: {{ .Values.server.config.githubGitURL | quote }}
  GREPNEST_GITHUB_API_VERSION: {{ .Values.server.config.githubAPIVersion | quote }}
  GREPNEST_GITHUB_APP_ID: {{ .Values.server.config.githubAppID | quote }}
  GREPNEST_GITHUB_PRIVATE_KEY_FILE: /var/run/secrets/grepnest/github/private-key.pem
  {{- if .Values.secrets.customCA.name }}
  GREPNEST_GITHUB_CA_FILE: /var/run/secrets/grepnest/ca/ca.crt
  {{- end }}
  GREPNEST_DATA_DIR: {{ .Values.node.paths.data | quote }}
  GREPNEST_INDEX_DIR: {{ .Values.node.paths.indexes | quote }}
  GREPNEST_GIT_PATH: {{ .Values.node.indexer.gitExecutable | quote }}
  GREPNEST_ZOEKT_GIT_INDEX: {{ .Values.node.indexer.zoektGitIndexExecutable | quote }}
  GREPNEST_MIN_FREE_BYTES: {{ printf "%d" (int64 .Values.node.indexer.minFreeBytes) | quote }}
  GREPNEST_MAX_REPOSITORY_BYTES: {{ printf "%d" (int64 .Values.node.indexer.maxRepositoryBytes) | quote }}
  GREPNEST_METRICS_LISTEN_ADDRESS: {{ printf ":%v" .Values.node.indexer.metricsPort | quote }}
