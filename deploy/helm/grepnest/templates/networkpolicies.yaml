{{- if .Values.networkPolicy.externalEgress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "deny-egress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-zoekt-egress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, node]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "grepnest.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node
      ports:
        - {protocol: TCP, port: {{ .Values.node.zoekt.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-dns-egress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, node, migration, scanner]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.externalEgress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.externalEgress.dns.podSelector | nindent 12 }}
      ports:
        {{- range .Values.networkPolicy.externalEgress.dns.ports }}
        - {protocol: UDP, port: {{ . }}}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-postgresql-egress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  # NetworkPolicy is pod-level: Zoekt shares this node policy, but only the
  # indexer container receives the database URL in the long-running node pod.
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, node, migration, scanner]
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.externalEgress.postgresql.cidrs }}
        - ipBlock: {cidr: {{ printf "%s/%v" .address .prefix | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.externalEgress.postgresql.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-github-egress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, node, scanner]
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.externalEgress.github.cidrs }}
        - ipBlock: {cidr: {{ printf "%s/%v" .address .prefix | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.externalEgress.github.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.externalEgress.enabled .Values.server.sso.oidc.enabled }}
---
