{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "deny-ingress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-server-ingress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- with .Values.networkPolicy.serverIngress.ingressControllerNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.networkPolicy.serverIngress.monitoringNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.server.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grepnest.resourceName" (list . "allow-zoekt-ingress") }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "grepnest.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "grepnest.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node
      ports:
        - {protocol: TCP, port: {{ .Values.node.zoekt.port }}}
---
