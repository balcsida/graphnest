{{- if .Values.scanner.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grepnest.scannerName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  replicas: {{ .Values.scanner.replicas }}
  selector:
    matchLabels:
      {{- include "grepnest.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scanner
  template:
    metadata:
      labels:
        {{- include "grepnest.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scanner
      annotations:
        {{- with .Values.scanner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "grepnest.scannerName" . }}
      securityContext:
        {{- include "grepnest.podSecurityContext" .Values.scanner.podSecurityContext | nindent 8 }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.scanner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scanner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scanner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scanner
          image: {{ include "grepnest.image" .Values.images.scanner | quote }}
          imagePullPolicy: {{ .Values.images.scanner.pullPolicy }}
          command: [{{ .Values.scanner.executable | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          ports:
            - {name: metrics, containerPort: {{ .Values.scanner.metricsPort }}, protocol: TCP}
          livenessProbe:
            tcpSocket: {port: metrics}
          readinessProbe:
            tcpSocket: {port: metrics}
          envFrom:
            - configMapRef:
                name: {{ include "grepnest.scannerName" . }}
          env:
            - {name: HOME, value: /var/run/grepnest}
            - name: GREPNEST_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.runtime.name }}, key: {{ .Values.secrets.runtime.databaseURLKey }}}
            - name: GREPNEST_WORKER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          resources:
            {{- toYaml .Values.scanner.resources | nindent 12 }}
          volumeMounts:
            - {name: worktree, mountPath: {{ .Values.scanner.dataPath }}}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-home, mountPath: /var/run/grepnest}
            - {name: github-app, mountPath: /var/run/secrets/grepnest/github, readOnly: true}
            {{- if .Values.secrets.customCA.name }}
            - {name: custom-ca, mountPath: /var/run/secrets/grepnest/ca/ca.crt, subPath: ca.crt, readOnly: true}
            {{- end }}
      volumes:
        - {name: worktree, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: runtime-home, emptyDir: {}}
        - name: github-app
          secret:
            secretName: {{ .Values.secrets.githubApp.name }}
            items:
              - {key: {{ .Values.secrets.githubApp.privateKeyKey }}, path: private-key.pem}
        {{- if .Values.secrets.customCA.name }}
        - name: custom-ca
          secret:
            secretName: {{ .Values.secrets.customCA.name }}
            items:
              - {key: {{ .Values.secrets.customCA.key }}, path: ca.crt}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grepnest.scannerName" . }}
  labels:
    {{- include "grepnest.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
spec:
  type: ClusterIP
  selector:
    {{- include "grepnest.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
  ports:
    - {name: metrics, port: {{ .Values.scanner.metricsPort }}, targetPort: metrics, protocol: TCP}
{{- end }}
