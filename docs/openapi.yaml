        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/imports:
    post:
      description: Import an SBOM produced elsewhere into a declared stream (import:<subject>:<label>) of an authorized repository. Accepts SPDX 2.3 JSON and CycloneDX 1.6 JSON only; the format is detected from the document, and a Content-Type that contradicts it is rejected. The original bytes are preserved and downloadable unchanged. The authenticated uploader is recorded separately from the producer the document claims; an optional subject_revision is recorded as producer_asserted, never verified. Identical bytes into the same stream return the earlier result (repeated=true). Administrators may import anywhere; other principals need a repository-scoped upload grant. Per-repository quotas apply to accepted and rejected attempts. External URLs inside documents are never dereferenced.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: subject, in: query, required: true, schema: {type: string, enum: [source, artifact]}}
        - {name: label, in: query, required: true, description: Stream label such as ort or syft-image, schema: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}}
        - {name: subject_revision, in: query, required: false, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/spdx+json: {schema: {type: object}}
          application/vnd.cyclonedx+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
      responses:
        '201': {description: Import accepted (published, or unchanged when the stream already serves this document), content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainImportResponse'}}}}
        '400': {description: Invalid parameters or a document that could not be parsed (malformed_document), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: No upload grant for this repository, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {description: Document exceeds the configured size or component limits, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '415': {description: Unsupported media type, format, or schema version (unsupported_format), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '429': {description: Import quota exhausted for this repository (quota_exceeded), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/upload-grants:
    put:
      description: Administrator-only. Grant or revoke a principal's (by subject) permission to import into one repository. Grants never widen read access.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [repository_id, subject, allow], properties: {repository_id: {type: integer, format: int64, minimum: 1}, subject: {type: string, minLength: 1, maxLength: 256}, allow: {type: boolean}}}}}}
      responses:
        '204': {description: Grant updated}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/exports/{id}/derived.spdx.json:
    get:
      description: Derived SPDX 2.3 JSON document for one authorized snapshot with GraphNest as creator. It links the preserved original by URL and SHA-256 (externalDocumentRefs) and carries GraphNest assessments only as licenseComments; licenseConcluded is always NOASSERTION and licenseDeclared holds only values that are valid SPDX expressions or sentinels. Review decisions are not part of the document. The original download is never altered.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: stream, in: query, required: false, schema: {type: string}}
        - {name: snapshot_id, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: Derived SPDX document (attachment) with X-GraphNest-Derived and X-GraphNest-Snapshot-ID, content: {application/spdx+json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/SupplyChainNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {description: Export exceeds the response limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/queue:
    get:
      description: Occurrences in the caller's authorized repositories whose current policy verdict is not approved and that have no current decision, or whose decision is stale (exception expired, or evidence changed since the decision). Each item carries the assessment basis fingerprint a reviewer must echo back.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: stream, in: query, required: false, schema: {type: string}}
        - {name: cursor, in: query, required: false, schema: {type: string, minLength: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Review queue, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainReviewQueue'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/conclusions:
    post:
      description: Record a human license conclusion for exact coordinates. Requires read access to the repository plus a review grant (administrators need no grant). The expression must be a valid SPDX expression with known identifiers, NONE, or UNLICENSED. The basis must equal the current assessment fingerprint of an occurrence in the repository (409 stale_basis otherwise). The conclusion is stored as 'human' evidence; automated evidence is retained and any disagreement stays visible in the assessment's conflict detail.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainConcludeRequest'}}}}
      responses:
        '201': {description: Conclusion recorded, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainConclusion'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: Review permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {description: Evidence changed since it was viewed (stale_basis), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/decisions:
    post:
      description: Record a scoped usage decision (approve, reject, or an exception with an expiry within one year) for exact coordinates in one repository. Same permission and basis rules as conclusions. The decision records the active policy version and current verdict; an exception never erases a prohibited verdict or rewrites the license. A newer decision supersedes the previous one; prior decisions remain in history.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainDecideRequest'}}}}
      responses:
        '201': {description: Decision recorded, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainDecision'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: Review permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {description: Evidence changed since it was viewed (stale_basis), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/history:
    get:
      description: Conclusions, decisions (current and superseded), and policy evaluation history for exact coordinates in one authorized repository, plus whether the current decision is stale.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: ecosystem, in: query, required: true, schema: {type: string}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
        - {name: version, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Review history, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainReviewHistory'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/grants:
    put:
      description: Administrator-only. Grant or revoke a subject's review capability for one repository. Reviewers still need read access to the repository and cannot grant themselves.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [repository_id, subject, allow], properties: {repository_id: {type: integer, format: int64, minimum: 1}, subject: {type: string, minLength: 1, maxLength: 256}, allow: {type: boolean}}}}}}
      responses:
        '204': {description: Grant updated}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/review/events:
    get:
      description: Append-only review audit events (policy changes, grants, conclusions, decisions) for the caller's authorized repositories.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Audit events, newest first, content: {application/json: {schema: {type: object, additionalProperties: false, required: [events], properties: {events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SupplyChainReviewEvent'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/supply-chain/policies:
    get:
      description: List policy versions (newest first). Exactly one organization policy may be active; the shipped example is labelled kind=example.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Policies, content: {application/json: {schema: {type: object, additionalProperties: false, required: [policies], properties: {policies: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SupplyChainPolicy'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      description: Administrator-only. Create a new immutable policy version (or install the labelled example fixture). unknown_handling must be review_required or prohibited; approved is refused so unknown licensing never auto-approves. Activating a policy deactivates the previous one; components are re-evaluated in the background and historical results are retained.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainCreatePolicyRequest'}}}}
      responses:
        '201': {description: Policy created, content: {application/json: {schema: {$ref: '#/components/schemas/SupplyChainPolicy'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/config:
    get:
      responses:
        '200':
          description: Token login availability and configured browser identity providers
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthConfig'}}}
  /v1/auth/session:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Current authentication method, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/logout:
    post:
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Session cookie cleared}
  /auth/local:
    post:
      description: Disabled-by-default administrator recovery login.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LocalLoginRequest'}}}
      responses:
        '204': {description: Standard session cookie issued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '429': {description: Login throttled, headers: {Retry-After: {schema: {type: integer, minimum: 1, maximum: 900}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /auth/local/rotate:
    post:
      description: Required password rotation for an eligible recovery administrator.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LocalRotationRequest'}}}
      responses:
        '204': {description: Password rotated and a fresh standard session cookie issued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '429': {description: Login throttled, headers: {Retry-After: {schema: {type: integer, minimum: 1, maximum: 900}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/oidc/login:
    get:
      responses: {'303': {description: Redirect to the configured browser identity provider}}
  /auth/oidc/callback:
    get:
      responses: {'303': {description: Redirect to the console}}
  /auth/oauth/github/login:
    get:
      responses: {'303': {description: Redirect to the configured GitHub browser identity provider}}
  /auth/oauth/github/callback:
    get:
      responses: {'303': {description: Redirect to the console, or to the exact request_id-bound /oauth/authorize/resume continuation supplied by GraphNest}}
  /v1/account/oauth-grants:
    get:
      description: Connected MCP clients (OAuth grants) of the current interactive user. Access tokens issued to those clients may not call this.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: cursor, in: query, required: false, schema: {type: string, minLength: 1}, description: Opaque cursor returned by the preceding page.}]
      responses:
        '200': {description: Live grants, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthGrantList'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit. The body is omitted when the error envelope also exceeds the limit., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/oauth-grants/{id}:
    delete:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Grant revoked; its access and refresh tokens stop working immediately}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /.well-known/oauth-protected-resource:
    get:
      description: RFC 9728 protected-resource metadata for /mcp. Served only when GRAPHNEST_MCP_OAUTH is enabled; /mcp then answers unauthenticated requests with WWW-Authenticate pointing here.
      responses:
        '200': {description: Resource metadata naming this origin as the authorization server, content: {application/json: {schema: {$ref: '#/components/schemas/ProtectedResourceMetadata'}}}}
  /.well-known/oauth-authorization-server:
    get:
      description: RFC 8414 authorization-server metadata. PKCE S256 is mandatory; only public clients and the authorization_code and refresh_token grants are supported.
      responses:
        '200': {description: Authorization server metadata, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorizationServerMetadata'}}}}
  /oauth/register:
    post:
      description: RFC 7591 dynamic registration of a public MCP client. redirect_uris must be loopback http URIs (any port) or https URIs.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRegistrationRequest'}}}}
      responses:
        '201': {description: Registered client; no secret is issued, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRegistration'}}}}
        '400': {description: Invalid metadata (RFC 7591 error body), content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '429': {description: Too many registrations, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '503': {description: Request limiter or registration service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
  /oauth/authorize:
    get:
      description: Authorization endpoint. Signs the user in through the browser provider when needed, then renders a consent page naming the client. An unknown client or unregistered redirect_uri yields a 400 HTML page and never a redirect.
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: code_challenge, in: query, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: state, in: query, required: false, schema: {type: string, maxLength: 1024}}
        - {name: scope, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri, description: Must equal the /mcp URL of this origin when present.}}
      responses:
        '200': {description: Consent page (HTML)}
        '303': {description: Redirect to sign-in, or to redirect_uri with an OAuth error}
        '400': {description: Unknown client or redirect_uri (HTML)}
        '429': {description: Authorization request limit exceeded (10 per source IP and 100 across the deployment per minute), content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '503': {description: Request limiter unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
    post:
      description: Consent decision from the page rendered by GET. Requires the same-origin Origin header, public request_id, and matching request-specific secret cookie issued by GET.
      requestBody: {required: true, content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/ConsentDecision'}}}}
      responses:
        '303': {description: Redirect to redirect_uri with code and state, or with error=access_denied}
        '400': {description: Expired or mismatched request (HTML)}
  /oauth/authorize/resume:
    get:
      description: Continuation target after sign-in; renders consent for exactly the pending request bound to request_id and its request-specific secret cookie. Concurrent browser authorizations remain independent.
      parameters:
        - {name: request_id, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}, description: Lowercase hexadecimal SHA-256 identifier of the pending request; this is not the secret cookie value.}
      responses:
        '200': {description: Consent page (HTML)}
        '400': {description: Nothing to resume (HTML)}
  /oauth/token:
    post:
      description: Token endpoint (RFC 6749 §4.1.3 and §6). Public clients only; refresh rotates both tokens. Consumed-token retries return invalid_grant without revoking the grant within 30 seconds of consumption; at or after that deadline they also revoke the grant. A lost refresh response requires fresh authorization. With GitHub access sync, a successful repository snapshot commits with rotation; rejected, expired, or missing credentials revoke only the current OAuth grant and return invalid_grant. A failure to persist that revocation returns 503 without mutation.
      requestBody: {required: true, content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/TokenRequest'}}}}
      responses:
        '200': {description: Tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}
        '400': {description: OAuth error (invalid_request, invalid_grant, unsupported_grant_type), content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '401': {description: invalid_client, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '429': {description: Too many requests, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '503': {description: Request limiter, token service, or configured GitHub credential unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
  /oauth/revoke:
    post:
      description: RFC 7009 revocation of an access or refresh token by the client that owns it. Unknown tokens still answer 200.
      requestBody: {required: true, content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/RevocationRequest'}}}}
      responses:
        '200': {description: Processed}
        '400': {description: client_id missing, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '429': {description: Too many revocation requests, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
        '503': {description: Request limiter or revocation service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}}
  /healthz:
    get:
      responses:
        '200': {description: Process is live, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
  /readyz:
    get:
      responses:
        '200': {description: Configured dependencies are ready, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
        '503':
          description: A configured dependency is unavailable
          content: {application/json: {schema: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string, const: unavailable}}}}}
  /metrics:
    get:
      responses:
        '200': {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: __Host-graphnest_session, description: Browser session; unsafe methods require the exact configured public Origin.}
  responses:
    InvalidRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    GraphConflict: {description: Graph request conflict; error code is ambiguous, branch_not_indexed, or graph_not_ready, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthenticated: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Administrator access required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AccountForbidden: {description: Account token request is not permitted for this durable principal or repository ceiling, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AdminNotFound: {description: Administrative identity resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AdminConflict: {description: Change would remove the caller or final active effective administrator, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Repository not found or not authorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Repository is not indexed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InvalidFile: {description: File cannot be returned, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BackendError: {description: Search backend failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Timeout: {description: Search timed out, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    SupplyChainNotFound: {description: 'Repository not authorized (not_found) or no inventory collected yet (no_inventory)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    APIToken:
      type: object
      additionalProperties: false
      required: [id, prefix, created_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        prefix: {type: string}
        repository_ids: {type: array, maxItems: 100, items: {type: integer, format: int64, minimum: 1}}
        delegation_only: {type: boolean, description: Present and true for delegation-only administrator tokens, which carry no repository ceiling.}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    APITokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties: {tokens: {type: array, items: {$ref: '#/components/schemas/APIToken'}}}
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      description: Expiry and repository restriction are optional for ordinary users. Administrator tokens require a non-empty repository restriction. Supplied expiry may be at most 90 days after creation.
      properties:
        expires_at: {type: string, format: date-time, description: Optional UTC expiry no more than 90 days after creation.}
