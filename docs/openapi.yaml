        enrichment_ecosystems: {type: array, items: {type: string, enum: [npm, nuget, maven]}}
        license_summary: {type: object, additionalProperties: {type: integer, minimum: 0}, description: Latest snapshot's assessment counts by status (unknown, declared, resolved, conflict, unlicensed, not_applicable, pending)}
        opt_out: {type: boolean}
