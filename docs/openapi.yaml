openapi: 3.1.0
info:
  title: GrepNest REST API
  version: 0.1.0
paths:
  /v1/repositories:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200':
          description: Authorized repositories and index status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}/status:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository index status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/files/read:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadFileRequest'}
      responses:
        '200':
          description: Bounded file content at the indexed revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadFileResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/InvalidFile'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/search:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/BackendError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/scip/uploads:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/vnd.scip+protobuf:
            schema:
              type: string
              format: binary
              description: Default upload limit is 67108864 bytes; server maximum is 268435456 bytes.
              x-default-max-bytes: 67108864
              x-server-max-bytes: 268435456
      responses:
        '204': {description: SCIP index replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/scip/navigation:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPNavigationRequest'}
      responses:
        '200':
          description: Authorized SCIP locations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SCIPNavigationResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/scip/dependencies:
    put:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPDependenciesRequest'}
      responses:
        '204': {description: Manual package metadata replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/scip/dependencies/github:
    post:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SCIPRepositoryRequest'}
      responses:
        '200':
          description: GitHub dependency metadata refresh result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SCIPDependencyRefreshResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /healthz:
    get:
      responses:
        '200': {description: Process is live, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
  /readyz:
    get:
      responses:
        '200': {description: Configured dependencies are ready, content: {text/plain: {schema: {type: string, example: "ok\\n"}}}}
        '503':
          description: A configured dependency is unavailable
          content: {application/json: {schema: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string, const: unavailable}}}}}
  /metrics:
    get:
      responses:
        '200': {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}
  /v1/auth/config:
    get:
      responses:
        '200':
          description: Token login availability and configured OIDC providers
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthConfig'}}}
        '405': {$ref: '#/components/responses/InvalidRequest'}
  /v1/auth/session:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200':
          description: Current authenticated browser identity metadata
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
  /auth/logout:
    post:
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Session cookie cleared}
        '405': {$ref: '#/components/responses/InvalidRequest'}
  /auth/oidc/login:
    get:
      responses:
        '303': {description: Redirect to the configured OIDC provider}
        '405': {$ref: '#/components/responses/InvalidRequest'}
  /auth/oidc/callback:
    get:
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303': {description: Redirect to the console after success or a generic authentication failure}
        '405': {$ref: '#/components/responses/InvalidRequest'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: __Host-grepnest_session}
  responses:
    InvalidRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthenticated: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Administrator access required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Repository not found or not authorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Repository is not indexed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InvalidFile: {description: File cannot be returned, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BackendError: {description: Search backend failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Timeout: {description: Search timed out, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    AuthConfig:
      type: object
      additionalProperties: false
      required: [token_login, providers]
      properties:
        token_login: {type: boolean}
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, login_url]
            properties:
              id: {type: string, example: oidc}
              label: {type: string, example: Sign in with SSO}
              login_url: {type: string, example: /auth/oidc/login}
    AuthSession:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: {type: string, enum: [static, oidc]}
        display_name: {type: string}
    RepositoryList:
      type: object
      additionalProperties: false
      required: [repositories, truncated]
      properties:
        repositories: {type: array, items: {$ref: '#/components/schemas/RepositorySummary'}}
        truncated: {type: boolean}
    RepositorySummary:
      type: object
      additionalProperties: false
      required: [id, github_id, name, branch, desired_sha, indexed_sha, status, error_code, search_node]
      properties:
        id: {type: integer, format: int64}
        github_id: {type: integer, format: int64}
        name: {type: string}
        branch: {type: string}
        desired_sha: {type: string}
        indexed_sha: {type: string}
        status: {type: string}
        error_code: {type: string}
        search_node: {type: string}
        last_indexed_at: {type: string, format: date-time}
    ReadFileRequest:
      type: object
      additionalProperties: false
      required: [repository_id, path]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        path: {type: string, minLength: 1}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
    ReadFileResponse:
      type: object
      additionalProperties: false
      required: [repository_id, path, indexed_sha, blob_sha, content, start_line, end_line, truncated]
      properties:
        repository_id: {type: integer, format: int64}
        path: {type: string}
        indexed_sha: {type: string}
        blob_sha: {type: string}
        content: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
        truncated: {type: boolean}
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string}
        repositories: {type: array, items: {type: string}}
        limit: {type: integer}
        context_lines: {type: integer}
        timeout: {type: integer, description: Go duration in nanoseconds}
        max_response_bytes: {type: integer, format: int64}
    SearchResponse:
      type: object
      additionalProperties: false
      required: [matches, truncated]
      properties:
        matches: {type: array, items: {$ref: '#/components/schemas/SearchMatch'}}
        truncated: {type: boolean}
    SearchMatch:
      type: object
      additionalProperties: false
      required: [repository, path, sha, line_number, line_start, line_end, preview, score]
      properties:
        repository: {$ref: '#/components/schemas/Repository'}
        path: {type: string}
        sha: {type: string}
        line_number: {type: integer, description: One-based source line used for repository-host anchors}
        line_start: {type: integer}
        line_end: {type: integer}
        preview: {type: string}
        score: {type: number, format: double}
    SCIPNavigationRequest:
      type: object
      additionalProperties: false
      required: [repository_id, path, line, operation]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        path: {type: string, minLength: 1, description: Clean relative slash-separated path}
        line: {type: integer, minimum: 1, description: One-based source line}
        character: {type: integer, minimum: 0, default: 0}
        operation: {type: string, enum: [definitions, references, implementations]}
    SCIPNavigationResponse:
      type: object
      additionalProperties: false
      required: [locations, truncated]
      properties:
        locations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SCIPLocation'}}
        truncated: {type: boolean}
    SCIPLocation:
      type: object
      additionalProperties: false
      required: [repository_id, repository_name, commit, path, symbol, start_line, start_character, end_line, end_character, position_encoding, roles, approximate]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        repository_name: {type: string}
        commit: {type: string, pattern: '^[0-9a-f]{40}$'}
        path: {type: string}
        symbol: {type: string}
        start_line: {type: integer, minimum: 1}
        start_character: {type: integer, minimum: 0}
        end_line: {type: integer, minimum: 1}
        end_character: {type: integer, minimum: 0}
        position_encoding: {type: string, enum: [UTF8CodeUnitOffsetFromLineStart, UTF16CodeUnitOffsetFromLineStart, UTF32CodeUnitOffsetFromLineStart]}
        roles: {type: integer, format: int32}
        approximate: {type: boolean}
    SCIPDependenciesRequest:
      type: object
      additionalProperties: false
      required: [repository_id]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        provides: {type: array, items: {type: string, minLength: 1}}
        depends_on: {type: array, items: {type: string, minLength: 1}}
    SCIPRepositoryRequest:
      type: object
      additionalProperties: false
      required: [repository_id]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
    SCIPDependencyRefreshResponse:
      type: object
      additionalProperties: false
      required: [available, packages]
      properties:
        available: {type: boolean}
        packages: {type: integer, minimum: 0}
    Repository:
      type: object
      additionalProperties: false
      required: [id, name, branch, indexed_sha, web_url]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        branch: {type: string}
        indexed_sha: {type: string}
        web_url: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            retryable: {type: boolean}
