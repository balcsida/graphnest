openapi: 3.1.0
info:
  title: GraphNest REST API
  version: 0.1.0
paths:
  /v1/account/api-tokens:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Current user's token metadata, content: {application/json: {schema: {$ref: '#/components/schemas/APITokenList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAPITokenRequest'}}}}
      responses:
        '201': {description: Token created; retain token now, it is never returned again, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedAPIToken'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/api-tokens/{id}:
    delete:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current user's token revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/delegation-tokens:
    post:
      description: Mint a delegation-only administrator API token. The caller must be an interactive administrator (session or OIDC; never an API token). The new token has no repository ceiling and no repository access of its own; its only permitted operation is POST /v1/admin/api-tokens, where it may delegate for any active repository. Intended for broker services that hand single-repository upload tokens to CI jobs, so the credential never needs re-widening as repositories are onboarded and a leak grants no direct access.
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDelegationOnlyTokenRequest'}}}}
      responses:
        '201': {description: Token created; retain token now, it is never returned again, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedDelegationOnlyToken'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/api-tokens:
    post:
      description: Administrator API-token delegation. The caller must authenticate with an administrator API token; the new token belongs to the same user and must expire within one hour. An ordinary administrator token may delegate a non-empty subset of its own repository ceiling; a delegation-only token (see /v1/account/delegation-tokens) may delegate for any active repository, and any unknown or inactive repository refuses the whole request. A delegated token cannot delegate again (403), so delegation is one generation deep. Interactive sessions use /v1/account/api-tokens instead.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelegateAPITokenRequest'}}}}
      responses:
        '201': {description: Token created; retain token now, it is never returned again, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedAPIToken'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/AccountForbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/overview:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Durable service totals, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOverview'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/audit-events:
    get:
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Bounded security audit events, newest first, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded users with effective access and explicit direct assignments, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: User with effective access and explicit direct assignments, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/access:
    put:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserAccessRequest'}}}}
      responses:
        '204': {description: Direct user access replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/suspend:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: User suspended and all credentials revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/restore:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: User restored}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/users/{id}/revoke-credentials:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: All user sessions and API tokens revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded groups with direct roles and repository grants, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroupList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200': {description: Group with direct roles and repository grants, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroup'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/groups/{id}/access:
    put:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccessRequest'}}}}
      responses:
        '204': {description: Direct group access replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AdminNotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/AdminConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/repositories:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200': {description: Cursor-paginated durable repository inventory ordered by full name, content: {application/json: {schema: {$ref: '#/components/schemas/AdminRepositoryList'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/jobs:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200': {description: Cursor-paginated indexing job inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminJobList'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/scip/uploads:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded SCIP upload inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSCIPUploadList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/scip/dependencies:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded SCIP dependency inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSCIPDependencyList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/webhook-deliveries:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Bounded webhook delivery inventory, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDeliveryList'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/github:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '200': {description: Sanitized GitHub App settings and installations, content: {application/json: {schema: {$ref: '#/components/schemas/AdminGitHub'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/repositories/{github_id}/reindex:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: github_id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current default branch SHA resolved and queued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/reconcile:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      responses:
        '204': {description: GitHub App installations reconciled}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/jobs/{id}/retry:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '204': {description: Current authorized failed job requeued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          description: next_cursor from a previous truncated response.
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Authorized repositories and index status, ordered by full name and cursor-paginated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/repositories/{id}/status:
    get:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized repository index status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositorySummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/files/read:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadFileRequest'}
      responses:
        '200':
          description: Bounded file content at the indexed revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadFileResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/InvalidFile'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/search:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/BackendError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/scip/uploads:
    post:
      security: [{bearerAuth: []}, {sessionCookie: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/vnd.scip+protobuf:
            schema:
              type: string
              format: binary
              description: Default upload limit is 67108864 bytes; server maximum is 268435456 bytes.
              x-default-max-bytes: 67108864
              x-server-max-bytes: 268435456
      responses:
        '204': {description: SCIP index replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/uploads:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {name: repository_id, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
      requestBody:
        required: true
        content:
          application/vnd.graphnest.graph.v1+protobuf:
            schema:
              type: string
              format: binary
              description: Default upload limit is 67108864 bytes; server maximum is 268435456 bytes.
              x-default-max-bytes: 67108864
              x-server-max-bytes: 268435456
      responses:
        '204': {description: External graph replaced}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/repositories/{id}/status:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized graph status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphStatus'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/graph/context:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphContextRequest'}}}}
      responses:
        '200': {description: Context result; status is found, not_found, or ambiguous, content: {application/json: {schema: {$ref: '#/components/schemas/GraphContextResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/GraphConflict'}
        '413': {$ref: '#/components/responses/InvalidRequest'}
        '415': {$ref: '#/components/responses/InvalidRequest'}
        '500': {description: Response exceeded the configured byte limit}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}
  /v1/graph/impact:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GraphImpactRequest'}}}}
      responses:
        '200': {description: Impact result; status is found, not_found, or ambiguous, content: {application/json: {schema: {$ref: '#/components/schemas/GraphImpactResponse'}}}}
