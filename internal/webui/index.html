<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrepNest</title>
<style>
:root{--ink:#172033;--canvas:#F6F8FA;--surface:#FFFFFF;--border:#D8DEE8;--signal:#2563EB;--match:#FFE08A;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,summary{font:inherit}input,button,summary{min-height:44px;border:1px solid var(--border);border-radius:4px;padding:8px}input{width:100%;background:var(--surface);color:var(--ink)}button{background:var(--signal);border-color:var(--signal);color:var(--surface);font-weight:700;cursor:pointer}
.app-bar{min-height:52px;padding:4px max(20px,calc((100vw - 1240px)/2));display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--surface)}.wordmark{color:inherit;font-weight:800;text-decoration:none;letter-spacing:.04em}.product-label{color:#C8D2E3}.app-bar #sign-out{margin-left:auto;background:transparent;border-color:var(--border)}
#search-form.search-strip{max-width:1240px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border-bottom:1px solid var(--border)}details{position:relative}summary{background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}fieldset{position:absolute;z-index:2;right:0;width:min(300px,calc(100vw - 40px));max-width:100%;margin-top:4px;padding:12px;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 8px 24px #09182d40}fieldset label{display:flex;gap:8px;align-items:center;min-height:44px}fieldset input{width:44px;min-width:44px;min-height:44px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}main{max-width:1240px;margin:auto;padding:32px 20px}#token-gate{display:grid;min-height:calc(100vh - 52px);place-items:start center;padding-top:48px}.token-panel{width:min(400px,100%);padding:28px;display:grid;gap:12px;background:var(--surface);border-top:5px solid var(--signal);box-shadow:0 10px 32px #09182d20}.token-panel>*{min-width:0}.eyebrow{margin:0;color:var(--signal);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.token-panel h1{margin:0}
#workspace{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px}#workspace>*{min-width:0}.context-rail{color:#5A687B}.context-rail code{display:block;margin:8px 0;color:var(--ink)}.results-panel,.results-summary,#results,.result{min-width:0}.results-summary h1{margin-top:0}#results{display:grid;gap:20px}.result{background:var(--surface);padding:18px;border-left:4px solid var(--match)}.result h2,.result h3{margin:.1em 0}.result h3{font:600 14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.result a{color:var(--signal);display:inline-flex;min-height:44px;align-items:center}pre{overflow-x:auto;padding:12px;background:#edf3fa;border:1px solid #c9d5e3}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#status{min-height:1.5em;color:#5A687B}#error{margin:12px 0;padding:12px;background:#fff1f0;color:#8b1e18;border-left:4px solid #b42318}:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
@media(max-width:760px){#search-form{grid-template-columns:minmax(0,1fr) auto}#search-form.search-strip #query{grid-column:1/-1}#workspace{grid-template-columns:1fr}fieldset{right:auto;left:0}}@media(prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}}@media(forced-colors: active){button,input,summary,fieldset,.result{border:1px solid CanvasText}.result{border-left-width:4px}}
</style>
</head>
<body data-grepnest-app>
<header class="app-bar">
<a class="wordmark" href="/">GrepNest</a>
<span class="product-label">Code search</span>
<button id="sign-out" type="button" hidden>Sign out</button>
</header>
<form id="search-form" class="search-strip" hidden>
<label class="sr-only" for="query">Search code</label>
<input id="query" name="query" type="search" autocomplete="off" spellcheck="false">
<details id="repository-picker"><summary><span id="repository-summary">All repositories</span></summary><fieldset id="repositories"><legend>Search repositories</legend><label><input id="all-repositories" type="checkbox" checked> All authorized repositories</label><div id="repository-options"></div></fieldset></details>
<button id="search-button" type="submit">Search</button>
</form>
<main>
<section id="token-gate" aria-labelledby="token-title"><form id="token-form" class="token-panel"><p class="eyebrow">Private code search</p><h1 id="token-title">Connect to GrepNest</h1><p>Use a bearer token for this browser session.</p><label for="token">Bearer token</label><input id="token" type="password" autocomplete="off" required><button type="submit">Open GrepNest</button></form></section>
<section id="workspace" hidden><aside class="context-rail" aria-label="Search context"><strong id="result-count">No search yet</strong><p id="repository-count">All authorized repositories</p><h2>Query examples</h2><code>file:\.go NewService</code><code>case:yes GrepNest</code></aside><section class="results-panel" aria-labelledby="results-title"><header class="results-summary"><h1 id="results-title">Code results</h1><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></header><div id="error" hidden></div><div id="results"></div></section></section>
</main>
<script>
"use strict";
const state={token:"",repositories:[],controller:null,repositoryController:null,generation:0,repositoryGeneration:0,retry:null};
const TOKEN_KEY="grepnest.token.v1";
const $=id=>document.getElementById(id);
function readToken(){try{return sessionStorage.getItem(TOKEN_KEY)||""}catch(_){return ""}}
function authenticate(token){state.token=token.trim();if(!state.token)return;resetRepositories();try{sessionStorage.setItem(TOKEN_KEY,state.token)}catch(_){}$("token-gate").hidden=true;$("workspace").hidden=false;$("search-form").hidden=false;$("sign-out").hidden=false;$("query").focus();void loadRepositories()}
function signOut(){if(state.controller)state.controller.abort();resetRepositories();state.token="";state.generation++;state.retry=null;try{sessionStorage.removeItem(TOKEN_KEY)}catch(_){}$("results").replaceChildren();$("error").hidden=true;$("workspace").hidden=true;$("search-form").hidden=true;$("sign-out").hidden=true;$("token-gate").hidden=false;$("token").value="";$("token").focus()}
async function request(path,init={}){const response=await fetch(path,{...init,headers:{...init.headers,Authorization:`Bearer ${state.token}`}});if(response.status===401){signOut();throw new DOMException("Unauthorized","AbortError")}if(!response.ok){let detail={};try{detail=await response.json()}catch(_){}const message=detail.error&&typeof detail.error.message==="string"?detail.error.message.trim():"";const error=new Error(message||(response.status>=500?"The service is unavailable.":"The request could not be completed."));error.requestID=detail.error&&detail.error.request_id;error.retryable=Boolean(detail.error&&detail.error.retryable);throw error}return response.json()}
async function loadRepositories(){const generation=state.repositoryGeneration,controller=state.repositoryController=new AbortController();try{const response=await request("/v1/repositories",{signal:controller.signal});if(generation!==state.repositoryGeneration||controller.signal.aborted||!state.token)return;if(response.truncated||!Array.isArray(response.repositories))return;state.repositories=response.repositories;const fragment=document.createDocumentFragment();for(const repository of state.repositories){const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.name="repository";input.value=repository.name;input.disabled=$("all-repositories").checked;input.addEventListener("change",updateRepositorySummary);label.append(input,document.createTextNode(" "+repository.name));fragment.append(label)}$("repository-options").replaceChildren(fragment)}catch(error){if(generation===state.repositoryGeneration&&error.name!=="AbortError")$("status").textContent="Repository choices are unavailable; searching all authorized repositories."}finally{if(generation===state.repositoryGeneration)state.repositoryController=null}}
function resetRepositories(){if(state.repositoryController)state.repositoryController.abort();state.repositoryController=null;state.repositoryGeneration++;state.repositories=[];$("repository-options").replaceChildren();$("all-repositories").checked=true;updateRepositorySummary()}
function selectedRepositories(){if($("all-repositories").checked)return null;return [...document.querySelectorAll("input[name=repository]:checked")].map(input=>input.value)}
function searchSnapshot(){return {query:$("query").value,repositories:selectedRepositories()}}
async function runSearch(snapshot){if(!snapshot.query.trim())return;if(snapshot.repositories&&snapshot.repositories.length===0){showError(new Error("Choose at least one repository."));return}if(state.controller)state.controller.abort();const controller=state.controller=new AbortController(),generation=++state.generation;state.retry=()=>runSearch(snapshot);$("status").textContent="Searching indexed code…";$("error").hidden=true;const body={query:snapshot.query};if(snapshot.repositories)body.repositories=snapshot.repositories;try{const response=await request("/v1/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:controller.signal});if(generation!==state.generation)return;renderResults(response);const repositories=new Set(response.matches.map(match=>match.repository.name));$("status").textContent=`${response.matches.length} matches in ${repositories.size} repositories${response.truncated?"; results were truncated.":"."}`}catch(error){if(generation===state.generation&&error.name!=="AbortError")showError(error,error.retryable?state.retry:null)}}
function groupMatches(matches){const groups=new Map();for(const match of matches){let paths=groups.get(match.repository.name);if(!paths)groups.set(match.repository.name,paths=new Map());let entries=paths.get(match.path);if(!entries)paths.set(match.path,entries=[]);entries.push(match)}return groups}
function renderResults(response){const fragment=document.createDocumentFragment(),groups=groupMatches(response.matches);$("result-count").textContent=`${response.matches.length} matches`;$("repository-count").textContent=`${groups.size} repositories`;if(!response.matches.length){const empty=document.createElement("p");empty.textContent="No matches. Try file:.go NewService";fragment.append(empty)}for(const [repository,paths] of groups){for(const [path,matches] of paths){const card=document.createElement("article"),heading=document.createElement("h2"),subheading=document.createElement("h3");card.className="result";heading.textContent=repository;subheading.textContent=path;card.append(heading,subheading);for(const match of matches){const line=document.createElement("p"),pre=document.createElement("pre"),code=document.createElement("code"),link=document.createElement("a");line.textContent=`Line ${match.line_number}`;code.textContent=match.preview;pre.append(code);link.href=blobURL(match);link.textContent="Open indexed source";link.target="_blank";link.rel="noopener noreferrer";card.append(line,pre,link)}fragment.append(card)}}$("results").replaceChildren(fragment)}
function blobURL(match){const url=new URL(match.repository.web_url);if(url.protocol!=="https:")throw new Error("Repository link is unavailable.");const base=url.href.replace(/\/$/,"");const encode=value=>String(value).split("/").map(encodeURIComponent).join("/");return `${base}/blob/${encode(match.sha)}/${encode(match.path)}#L${match.line_number}`}
function showError(error,retry){const box=$("error"),fragment=document.createDocumentFragment(),message=document.createElement("span");message.textContent=error.message||"The request could not be completed.";fragment.append(message);if(error.requestID){const id=document.createElement("small");id.textContent=` Request ID: ${error.requestID}`;fragment.append(id)}if(retry){const button=document.createElement("button");button.type="button";button.textContent="Retry";button.addEventListener("click",retry,{once:true});fragment.append(document.createTextNode(" "),button)}box.replaceChildren(fragment);box.hidden=false}
function updateRepositorySummary(){const all=$("all-repositories"),choices=[...document.querySelectorAll("input[name=repository]")];choices.forEach(choice=>{choice.disabled=all.checked});const selected=selectedRepositories();$("repository-summary").textContent=selected?`${selected.length} repositories`:"All repositories"}
$("token-form").addEventListener("submit",event=>{event.preventDefault();authenticate($("token").value)});$("sign-out").addEventListener("click",signOut);$("search-form").addEventListener("submit",event=>{event.preventDefault();void runSearch(searchSnapshot())});$("all-repositories").addEventListener("change",updateRepositorySummary);$("query").addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key==="Enter")$("search-form").requestSubmit()});document.addEventListener("keydown",event=>{const editable=event.target.matches("input,textarea,[contenteditable]");if(event.key==="/"&&!editable){event.preventDefault();$("query").focus()}});const remembered=readToken();if(remembered)authenticate(remembered);
</script>
</body>
</html>
